name: TerraNexus Production CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Test Suite & Safety Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest with Coverage
        run: |
          cd backend
          python -m pytest tests --cov=app --cov-report=term-missing --cov-fail-under=80

      - name: Run Full Acceptance & Verification Suite
        run: |
          python scripts/verify_e2e.py

  frontend-check:
    name: Frontend Typecheck & Build Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci || npm install

      - name: Typecheck Frontend
        working-directory: ./frontend
        run: npm run typecheck

      - name: Build Frontend Production Artifacts
        working-directory: ./frontend
        run: npm run build
