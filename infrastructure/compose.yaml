services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: terranexus
      POSTGRES_USER: terranexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terranexus -d terranexus"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis_data:/data"]
  mqtt:
    image: eclipse-mosquitto:2
    ports: ["1883:1883", "9001:9001"]
    environment:
      MQTT_BACKEND_PASSWORD: ${MQTT_BACKEND_PASSWORD:-tnx_backend_secure_2026}
      MQTT_DEVICE_PASSWORD: ${MQTT_DEVICE_PASSWORD:-tnx_secure_field_pass_2026}
    entrypoint: ["/bin/sh", "/docker-entrypoint-custom.sh"]
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto_acl.conf:/mosquitto/config/mosquitto_acl.conf:ro
      - ./mosquitto-entrypoint.sh:/docker-entrypoint-custom.sh:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 -u terranexus_backend -P \"$${MQTT_BACKEND_PASSWORD:-tnx_backend_secure_2026}\" -i healthcheck -W 3 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
  api:
    build: ../backend
    env_file: ../.env
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
      mqtt: {condition: service_healthy}
volumes:
  postgres_data:
  redis_data:
  mosquitto_data:
  mosquitto_log:
