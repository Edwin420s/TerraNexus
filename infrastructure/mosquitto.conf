# Mosquitto Broker Configuration for TerraNexus
# Standard Production Profile: Authenticated with per-tenant ACL enforcement
listener 1883
allow_anonymous false
password_file /mosquitto/config/passwords
acl_file /mosquitto/config/mosquitto_acl.conf
persistence true
persistence_location /mosquitto/data/
log_dest stdout

# For local offline developer tests without authentication, run with mosquitto_dev.conf:
# mosquitto -c infrastructure/mosquitto_dev.conf
