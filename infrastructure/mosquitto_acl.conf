# TerraNexus MQTT Access Control List (ACL)
# Enforces tenant and device boundary isolation

# Service Publisher & Subscriber (Backend API)
user terranexus_backend
topic readwrite tnx/#
topic read $SYS/#

# Field Gateway Bridge
user tnx_field_gateway
topic readwrite tnx/#

# Pattern-based per-tenant and per-device isolation:
# Username (%u) is the device UID assigned during provisioning
pattern write tnx/+/farm/+/device/%u/telemetry
pattern write tnx/+/farm/+/device/%u/heartbeat
pattern write tnx/+/farm/+/device/%u/commands/ack
pattern read tnx/+/farm/+/device/%u/commands

# Direct device wildcard and client ID compatibility
pattern readwrite tnx/+/%u/#
pattern readwrite tnx/+/farm/+/device/%c/#

