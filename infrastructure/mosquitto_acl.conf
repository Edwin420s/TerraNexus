# TerraNexus MQTT Access Control List (ACL)
# Enforces tenant and device boundary isolation

# Service Publisher (Backend API)
user terranexus_backend
topic readwrite tnx/#

# Pattern-based per-tenant and per-device isolation:
# Devices can only write to their own telemetry/heartbeat and read their own commands
pattern write tnx/%u/farm/+/device/%c/telemetry
pattern write tnx/%u/farm/+/device/%c/heartbeat
pattern write tnx/%u/farm/+/device/%c/commands/ack
pattern read tnx/%u/farm/+/device/%c/commands
